<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYBS Draft Board – TV</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#0a1628; --bg2:#0d1f3c; --bg3:#162847;
  --gold:#f5a623; --text:#f0f6fc; --text2:#8b949e;
  --border:rgba(255,255,255,0.07);
  --clock-color: var(--gold);
}
html,body { width:100%; height:100%; background:var(--bg); color:var(--text);
  font-family:'DM Sans',sans-serif; overflow:hidden; user-select:none; }

/* ── CONNECTING ── */
#tv-connecting { position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:300; background:var(--bg); gap:14px; }
#tv-connecting h1 { font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:36px; color:var(--gold); letter-spacing:2px; }
#tv-connecting p  { color:var(--text2); font-size:14px; }
.dots { display:flex; gap:8px; }
.dots span { width:10px; height:10px; border-radius:50%; background:var(--gold);
  animation:dp 1.2s ease-in-out infinite; }
.dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{transform:scale(.4);opacity:.3}40%{transform:scale(1);opacity:1}}

/* ── MAIN LAYOUT: header + body ── */
#tv-main { display:none; height:100vh; flex-direction:column; overflow:hidden; }

/* ── HEADER BAR ── */
#tv-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; height:54px; flex-shrink:0;
  background:var(--bg2); border-bottom:1px solid var(--border);
}
#tv-logo { font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:26px; color:var(--gold); letter-spacing:2px; }
#tv-header-center { display:flex; align-items:center; gap:12px; }
#tv-on-clock {
  font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:17px; letter-spacing:1px;
  padding:4px 18px; border-radius:6px;
  border:1px solid rgba(245,166,35,.3); background:rgba(245,166,35,.12); color:var(--gold);
}
#tv-pick-info { font-size:12px; color:var(--text2); letter-spacing:.5px; }

/* ── BODY: 3-panel ── */
#tv-body { display:flex; flex:1; overflow:hidden; }

/* ═══════════════════════════════════════════
   LEFT PANEL: ON THE CLOCK spotlight
   ═══════════════════════════════════════════ */
#tv-clock-panel {
  width:320px; flex-shrink:0; display:flex; flex-direction:column;
  background:var(--bg2); border-right:1px solid var(--border);
  overflow:hidden; position:relative;
}
#tv-clock-bg {
  position:absolute; inset:0; pointer-events:none;
  transition:background 0.8s ease;
}
#tv-clock-content {
  position:relative; z-index:2; flex:1;
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:24px 20px; gap:0;
}
#tv-clock-label {
  font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:11px; letter-spacing:4px;
  color:rgba(255,255,255,.4); margin-bottom:12px;
}
#tv-clock-logo {
  width:110px; height:110px; border-radius:16px; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.1);
  margin-bottom:18px; flex-shrink:0;
  box-shadow: 0 0 0 0 rgba(255,255,255,0);
  transition: box-shadow 0.5s ease;
}
#tv-clock-logo img { width:100%; height:100%; object-fit:contain; }
#tv-clock-team-name {
  font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:32px; letter-spacing:1.5px;
  text-align:center; line-height:1; margin-bottom:6px;
}
#tv-clock-coach {
  font-size:11px; color:rgba(255,255,255,.4); text-align:center;
  margin-bottom:20px; letter-spacing:.5px;
}

/* Live pick timer */
#tv-pick-timer-wrap {
  display:flex; flex-direction:column; align-items:center; gap:4px;
  margin-bottom:20px;
}
#tv-pick-timer {
  font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:64px; line-height:1; letter-spacing:2px;
  text-align:center; transition:color .3s;
}
#tv-pick-timer-label {
  font-size:10px; color:rgba(255,255,255,.35); letter-spacing:3px; text-transform:uppercase;
}

/* Round + pick indicator */
#tv-round-pick {
  font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:15px; letter-spacing:2px;
  color:rgba(255,255,255,.4); text-align:center; margin-bottom:20px;
}

/* Pick order strip at bottom of clock panel */
#tv-order-strip {
  border-top:1px solid var(--border); padding:12px 16px; flex-shrink:0;
}
#tv-order-label {
  font-size:9px; color:var(--text2); text-transform:uppercase;
  letter-spacing:2px; margin-bottom:8px;
}
#tv-order-chips {
  display:flex; gap:5px; flex-wrap:wrap;
}
.tv-order-chip {
  font-size:10px; font-weight:700; padding:3px 9px; border-radius:4px;
  border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.3);
  white-space:nowrap;
}
.tv-order-chip.oc {
  color:var(--gold); border-color:rgba(245,166,35,.5);
  background:rgba(245,166,35,.12); font-size:11px;
}
.tv-order-chip.done { opacity:.25; text-decoration:line-through; }

/* ═══════════════════════════════════════════
   MIDDLE PANEL: NFL Prospect List
   ═══════════════════════════════════════════ */
#tv-avail {
  width:580px; flex-shrink:0; display:flex; flex-direction:column;
  border-right:1px solid var(--border);
}
#tv-avail-head {
  padding:12px 16px 10px; border-bottom:1px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
}
.avail-title { font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:14px; letter-spacing:2px; color:var(--text2); }
.avail-count { font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:16px; color:var(--gold); }
#tv-avail-list {
  flex:1; overflow-y:auto; padding:8px 10px;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.08) transparent;
  display:grid; grid-template-columns:1fr 1fr; gap:6px; align-content:start;
}

/* Prospect rows */
.tvp {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:10px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.03);
  position:relative; overflow:hidden;
  transition:background .15s;
}

.tvp-av {
  width:42px; height:42px; border-radius:50%; flex-shrink:0;
  overflow:hidden; background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.1);
  display:flex; align-items:center; justify-content:center;
  font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:14px; color:var(--text2);
}
.tvp-av img { width:100%; height:100%; object-fit:cover; }
.tvp-info { flex:1; min-width:0; }
.tvp-name { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tvp-sub { font-size:10px; color:var(--text2); display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.tvp-pos {
  font-size:9px; font-weight:700; padding:1px 5px; border-radius:3px;
}

.tvp-accent { position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:3px 0 0 3px; }

/* ═══════════════════════════════════════════
   RIGHT PANEL: NFL Draft Board
   ═══════════════════════════════════════════ */
#tv-board {
  flex:1; display:flex; flex-direction:column; overflow:hidden;
}
#tv-board-head {
  padding:12px 16px 10px; border-bottom:1px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
}
.board-title { font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:14px; letter-spacing:2px; color:var(--text2); }
#tv-board-body {
  flex:1; overflow-x:auto; overflow-y:hidden; display:flex; align-items:stretch;
  padding:8px 10px; gap:6px;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.08) transparent;
}

/* Team column */
.tvb-col { display:flex; flex-direction:column; min-width:130px; max-width:160px; flex:1; }
.tvb-col-head {
  border-radius:8px 8px 0 0; padding:8px 10px 7px;
  text-align:center; flex-shrink:0; margin-bottom:5px;
}
.tvb-col-name { font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:14px; letter-spacing:.5px; color:#fff; }
.tvb-col-coach { font-size:9px; color:rgba(255,255,255,.35); margin-top:1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.tvb-slots { flex:1; display:flex; flex-direction:column; gap:2px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.06) transparent; }

/* Pick slot */
.tvb-slot {
  border-radius:4px; padding:3px 6px 3px 8px;
  border:1px solid rgba(255,255,255,.06); position:relative;
  overflow:hidden; flex-shrink:0; min-height:22px;
  display:flex; flex-direction:column; justify-content:center;
}
.tvb-slot-filled { }
.tvb-slot-pre { }
.tvb-slot-gap { border-color:transparent; background:transparent; }
.tvb-slot-oc {
  border-style:dashed; animation:slotPulse 1.5s ease-in-out infinite;
}
@keyframes slotPulse { 0%,100%{opacity:.4} 50%{opacity:1} }
.tvb-slot-empty { opacity:.2; }
.tvb-slot-bar {
  position:absolute; left:0; top:0; bottom:0; width:2px;
  border-radius:2px 0 0 2px;
}
.tvb-slot-name {
  font-size:12px; font-weight:700; color:#fff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  line-height:1.2;
}
.tvb-slot-meta { font-size:7px; color:rgba(255,255,255,.3); line-height:1; }
.tvb-col-count { text-align:center; font-size:8px; color:rgba(255,255,255,.35); padding:2px 0; }
.tvb-col-active { }


/* ═══════════════════════
   PICK BANNER (overlay)
   ═══════════════════════ */
#tv-banner {
  position:fixed; inset:0; z-index:999;
  pointer-events:none; overflow:hidden;
  opacity:0; transition:opacity .3s;
}
#tv-banner.visible { opacity:1; pointer-events:all; }

#tv-ph1 {
  position:absolute; inset:0; background:#fff;
  display:flex; align-items:center;
  padding:clamp(28px,5vw,100px);
  overflow:hidden;
  transition:opacity .4s ease;
}
#tv-ph1.out { opacity:0; }
#tv-ph1-text {
  font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:clamp(80px,17vw,240px);
  line-height:.82; letter-spacing:-3px; color:#111;
  animation:ph1Wipe .5s cubic-bezier(.16,1,.3,1) both;
}
@keyframes ph1Wipe {
  from { clip-path:inset(0 100% 0 0); }
  to   { clip-path:inset(0 0% 0 0); }
}
#tv-ph1-logo {
  position:absolute; top:clamp(20px,3vw,50px); right:clamp(24px,4vw,70px);
  width:clamp(70px,9vw,140px);
}
#tv-ph1-logo img { width:100%; height:auto; }
#tv-ph1-bar { position:absolute; bottom:0; left:0; right:0; height:12px; }

#tv-ph2 {
  position:absolute; inset:0; overflow:hidden;
  opacity:0; transition:opacity .5s ease;
}
#tv-ph2.in { opacity:1; }

#tv-ph2-bg {
  position:absolute; inset:0;
  animation:bgWipe .55s cubic-bezier(.77,0,.18,1) both;
}
@keyframes bgWipe {
  from { clip-path:inset(0 100% 0 0); }
  to   { clip-path:inset(0 0% 0 0); }
}
#tv-grain {
  position:absolute; inset:0; pointer-events:none; opacity:.055;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:180px 180px;
}
#tv-vignette {
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 55% 50%, rgba(0,0,0,0) 25%, rgba(0,0,0,.6) 100%);
}
#tv-flare {
  position:absolute; top:-20%; bottom:-20%; width:50%;
  background:linear-gradient(to right, transparent, rgba(255,255,255,.14), transparent);
  transform:skewX(-18deg);
  animation:flare .9s ease .7s both;
}
@keyframes flare { from{left:-80%} to{left:170%} }
#tv-accent { position:absolute; left:0; top:0; bottom:0; width:8px; z-index:3; }
#tv-ph2-layout {
  position:relative; z-index:2; height:100%;
  display:flex; align-items:center;
  gap:clamp(20px,3vw,60px);
  padding:clamp(24px,4vw,64px) clamp(28px,5vw,80px);
}
#tv-ph2-logo-col { flex-shrink:0; display:flex; align-items:center; justify-content:center; }
#tv-ph2-logo-col img {
  width:clamp(160px,22vw,340px); height:auto;
  animation:logoDrop .65s cubic-bezier(.34,1.56,.64,1) .1s both;
  filter:drop-shadow(0 0 40px rgba(0,0,0,.7));
}
@keyframes logoDrop {
  0%   { transform:translateY(-110px) scale(.8); opacity:0; }
  70%  { transform:translateY(9px) scale(1.05); }
  100% { transform:translateY(0) scale(1); opacity:1; }
}
#tv-ph2-names { flex:1; display:flex; flex-direction:column; justify-content:center; min-width:0; }
#tv-ph2-meta {
  font-size:clamp(12px,1.5vw,18px); letter-spacing:3.5px;
  color:rgba(255,255,255,.5); margin-bottom:6px;
  animation:slamL .45s cubic-bezier(.22,1,.36,1) .22s both;
}
#tv-ph2-team {
  font-size:clamp(14px,2.2vw,26px); letter-spacing:3px; font-weight:800;
  margin-bottom:8px;
  animation:slamL .45s cubic-bezier(.22,1,.36,1) .28s both;
}
#tv-ph2-first {
  font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:clamp(52px,9vw,130px);
  line-height:1; letter-spacing:2px; font-style:italic;
  text-shadow:0 4px 32px rgba(0,0,0,.6);
  animation:slamL .5s cubic-bezier(.22,1,.36,1) .32s both;
}
#tv-ph2-last {
  font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size:clamp(80px,15vw,220px);
  line-height:.82; color:#fff; letter-spacing:1px;
  text-shadow:0 8px 60px rgba(0,0,0,.6);
  animation:slamR .55s cubic-bezier(.22,1,.36,1) .24s both;
  margin-bottom:clamp(14px,2vw,28px);
}
#tv-ph2-pos {
  display:flex; gap:12px; flex-wrap:wrap;
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1) .54s both;
}
.tv-pos-badge {
  font-family:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; display:inline-block;
  font-size:clamp(18px,4vw,54px); font-weight:900; letter-spacing:2px;
  padding:6px 28px; transform:skewX(-4deg);
  box-shadow:5px 5px 0 rgba(0,0,0,.35), 0 10px 40px rgba(0,0,0,.4);
  color:#000;
}
.tv-pos-badge.impact {
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1) .54s both,
            impactShake .2s ease .74s both;
}
#tv-ph2-sub {
  display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  margin-top:14px;
  animation:slamL .4s ease .7s both;
}
.ph2-sub-chip {
  font-family:'DM Sans',sans-serif; font-size:clamp(12px,1.6vw,18px);
  font-weight:700; padding:4px 14px; border-radius:20px;
  background:rgba(255,255,255,.1); color:rgba(255,255,255,.7);
  letter-spacing:1px;
}
.ph2-dismiss {
  position:absolute; bottom:18px; right:22px; z-index:5;
  font-size:12px; color:rgba(255,255,255,.2); letter-spacing:2px;
  animation:pulseFade 2s ease-in-out .9s infinite;
  font-family:'DM Sans',sans-serif;
}

@keyframes slamL { 0%{transform:translateX(-80px);opacity:0} 65%{transform:translateX(5px)} 100%{transform:translateX(0);opacity:1} }
@keyframes slamR { 0%{transform:translateX(80px) scaleX(1.08);opacity:0} 60%{transform:translateX(-5px) scaleX(.99)} 100%{transform:translateX(0) scaleX(1);opacity:1} }
@keyframes popIn  { 0%{transform:scale(0) skewX(-4deg);opacity:0} 65%{transform:scale(1.14) skewX(-4deg)} 100%{transform:scale(1) skewX(-4deg);opacity:1} }
@keyframes impactShake { 0%,100%{transform:scale(1) skewX(-4deg) translate(0)} 25%{transform:scale(1) skewX(-4deg) translate(-3px,1px)} 75%{transform:scale(1) skewX(-4deg) translate(2px,-1px)} }
@keyframes pulseFade{0%,100%{opacity:.2}50%{opacity:.65}}
</style>
</head>

<script>
'use strict';
let tvState = null, localHeadshots = {}, localHelmetLogo = null;
let _stateRequested = false;
let _clockStart = null, _clockInterval = null, _clockTeamIdx = -1;

const bc = new BroadcastChannel('lybs_draft_tv');
bc.onmessage = e => {
  const d = e.data;
  if (d.type === 'draft_state') {
    if (!_draftStartTime) _draftStartTime = Date.now();
    if (d.headshots)  Object.assign(localHeadshots, d.headshots);
    if (d.helmetLogo) { localHelmetLogo = d.helmetLogo; _applyHelmet(); }
    applyState(d.state);
  }
  if (d.type === 'draft_pick') {
    if (!_draftStartTime) _draftStartTime = Date.now();
    if (d.headshots)  Object.assign(localHeadshots, d.headshots);
    if (d.helmetLogo) { localHelmetLogo = d.helmetLogo; _applyHelmet(); }
    showBanner(d.pick, d.state);
    if (typeof _playSound !== 'undefined') _playSound('draftPick', 0.9);
    setTimeout(() => applyState(d.state), 4500);
  }
  if (d.type === 'ping') bc.postMessage({ type: 'pong' });
};
// Keep requesting state every 3s until the draft goes live
// (_stateRequested is only set true once a live draft is detected in applyState)
function _requestState() {
  if (_stateRequested) return;
  try { bc.postMessage({ type: 'request_state' }); } catch(e) {}
  setTimeout(_requestState, 3000);
}
setTimeout(_requestState, 600);

document.getElementById('tv-banner').addEventListener('click', dismissBanner);

// Draft runtime clock
let _draftStartTime = null;
function _fmtRuntime(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}
setInterval(() => {
  if (!_draftStartTime) { document.getElementById('tv-clock-right').textContent = ''; return; }
  document.getElementById('tv-clock-right').textContent = _fmtRuntime(Date.now() - _draftStartTime);
}, 1000);

// ── Apply helmet logo to banner (phase 1 only) ──────────────
function _applyHelmet() {
  if (!localHelmetLogo) return;
  const ph1 = document.getElementById('tv-ph1-logo-img');
  if (ph1) { ph1.src = localHelmetLogo; ph1.style.display = ''; }
}

// ── Pick timer ──────────────────────────────────────────────
function startPickTimer(teamIdx) {
  if (_clockTeamIdx === teamIdx && _clockStart) return; // already running for same team
  _clockTeamIdx = teamIdx;
  _clockStart = Date.now();
  clearInterval(_clockInterval);
  _clockInterval = setInterval(updatePickTimer, 500);
  updatePickTimer();
}
function stopPickTimer() {
  clearInterval(_clockInterval);
  _clockStart = null; _clockTeamIdx = -1;
}
function updatePickTimer() {
  if (!_clockStart) return;
  const elapsed = Math.floor((Date.now() - _clockStart) / 1000);
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  const fmt = `${m}:${s.toString().padStart(2, '0')}`;
  const el = document.getElementById('tv-pick-timer');
  if (!el) return;
  el.textContent = fmt;
  // Color: green → gold → red based on time
  const c = elapsed < 60 ? '#10b981' : elapsed < 120 ? '#f5a623' : '#ef4444';
  el.style.color = c;
}

// ── Apply state ─────────────────────────────────────────────
// ── Intro screen — shown when draft starts for the first time ─────────
let _introShown = false;

function showDraftIntro(state, onComplete) {
  const intro = document.getElementById('tv-intro');
  if (!intro) { onComplete(); return; }

  // Fill division text
  const div = state.division || 'BASEBALL';
  document.getElementById('tv-intro-division').textContent = div.toUpperCase();

  // Show overlay
  intro.style.display = 'flex';

  // Animate in elements after a frame
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const logo  = document.getElementById('tv-intro-logo');
      const title = document.getElementById('tv-intro-title');
      const year  = document.getElementById('tv-intro-year');
      if (logo)  { logo.style.opacity  = '1'; logo.style.transform  = 'translateY(0) scale(1)'; }
      if (title) { title.style.opacity = '1'; title.style.transform = 'scale(1)'; }
      if (year)  { year.style.opacity  = '1'; year.style.transform  = 'translateY(0)'; }
    });
  });

  // Hold for 3.2s, then fade out and show board
  setTimeout(() => {
    intro.style.transition = 'opacity .8s ease';
    intro.style.opacity = '0';
    setTimeout(() => {
      intro.style.display = 'none';
      intro.style.opacity = '';
      intro.style.transition = '';
      // Reset for next time
      ['tv-intro-logo','tv-intro-title','tv-intro-year'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.style.opacity = '0';
        if (id === 'tv-intro-logo')  { el.style.transform = 'translateY(-40px) scale(0.85)'; }
        if (id === 'tv-intro-title') { el.style.transform = 'scale(0.8)'; }
        if (id === 'tv-intro-year')  { el.style.transform = 'translateY(20px)'; }
      });
      onComplete();
    }, 800);
  }, 3200);
}

function applyState(state) {
  if (!state) return;
  tvState = state;

  const hasPicks  = (state.currentPickIdx || 0) > 0;
  const hasPlayers = (state.players || []).length > 0;
  const isLive    = state.phase === 'draft' && hasPlayers;
  const isComplete = state.phase === 'complete';

  // If the draft hasn't started yet, keep the waiting screen up and keep retrying
  if (!isLive && !isComplete) {
    // Don't stop the retry — a new state may arrive when draft actually begins
    return;
  }

  // Draft is active — stop retrying and show the board
  _stateRequested = true;
  document.getElementById('tv-connecting').style.display = 'none';

  // Show intro the very first time a live draft starts with no picks yet
  if (isLive && !hasPicks && !_introShown) {
    _introShown = true;
    showDraftIntro(state, () => {
      document.getElementById('tv-main').style.display = 'flex';
      _applyStateInner(state);
    });
    return;
  }

  document.getElementById('tv-main').style.display = 'flex';
  _applyStateInner(state);
}

function _applyStateInner(state) {
  if (!state) return;
  tvState = state;
  _applyHelmet();

  const teams = state.teams || [], order = state.draftOrder || [], cur = state.currentPickIdx || 0;
  const isDone = cur >= order.length || state.phase === 'complete';
  const curTi = isDone ? -1 : order[cur];
  const curT = curTi >= 0 ? teams[curTi] : null;
  const round = Math.floor(cur / Math.max(1, teams.length)) + 1;
  const pickN = (cur % Math.max(1, teams.length)) + 1;

  // Header
  const oc = document.getElementById('tv-on-clock');
  if (curT) {
    oc.textContent = (curT.name || 'Team').toUpperCase() + ' IS ON THE CLOCK';
    oc.style.color = curT.color || 'var(--gold)';
    oc.style.borderColor = (curT.color || '#f5a623') + '55';
    oc.style.background = (curT.color || '#f5a623') + '18';
  } else {
    oc.textContent = isDone ? '✓ DRAFT COMPLETE' : 'DRAFT BOARD';
    oc.style.cssText = '';
  }
  document.getElementById('tv-pick-info').textContent = `ROUND ${round} · PICK ${pickN}`;

  // Left panel
  renderClockPanel(curT, curTi, round, pickN, order, cur, teams);

  // Middle: available
  renderAvailable(state);

  // Right: NFL board
  renderBoard(state);
}

// ── Left spotlight panel ────────────────────────────────────
function renderClockPanel(curT, curTi, round, pickN, order, cur, teams) {
  const isDone = !curT;

  // Background glow
  const bg = document.getElementById('tv-clock-bg');
  bg.style.background = isDone ? 'transparent'
    : `radial-gradient(ellipse at 50% 40%, ${curT.color}22 0%, transparent 70%)`;

  // Logo
  const logoImg = document.getElementById('tv-clock-logo-img');
  const logoInit = document.getElementById('tv-clock-logo-init');
  const logo = document.getElementById('tv-clock-logo');
  if (curT?.logo) {
    logoImg.src = curT.logo; logoImg.style.display = '';
    logoInit.style.display = 'none';
    logo.style.borderColor = (curT.color || '#fff') + '55';
    logo.style.boxShadow = `0 0 32px ${curT.color || '#f5a623'}44, 0 0 0 1px ${curT.color || '#fff'}22`;
  } else if (localHelmetLogo && !curT?.logo) {
    logoImg.src = localHelmetLogo; logoImg.style.display = '';
    logoInit.style.display = 'none';
    logo.style.borderColor = (curT?.color || '#f5a623') + '44';
    logo.style.boxShadow = 'none';
  } else {
    logoImg.style.display = 'none';
    logoInit.style.display = '';
    logoInit.textContent = curT ? (curT.name || '?')[0].toUpperCase() : '✓';
    logo.style.boxShadow = 'none';
  }

  // Team name + coach
  const nameEl = document.getElementById('tv-clock-team-name');
  nameEl.textContent = isDone ? 'DRAFT COMPLETE' : (curT.name || '').toUpperCase();
  nameEl.style.color = isDone ? 'var(--gold)' : (curT.color || 'var(--gold)');

  const coachEl = document.getElementById('tv-clock-coach');
  coachEl.textContent = curT?.coach ? `Coach ${curT.coach}` : '';

  // Timer
  if (!isDone) {
    startPickTimer(curTi);
  } else {
    stopPickTimer();
    const timerEl = document.getElementById('tv-pick-timer');
    if (timerEl) { timerEl.textContent = '—'; timerEl.style.color = 'var(--text2)'; }
  }

  document.getElementById('tv-round-pick').textContent = isDone ? 'DRAFT COMPLETE'
    : `ROUND ${round} · PICK ${pickN} OF ${order.length}`;

  // Pick order chips
  const numTeams = Math.max(1, teams.length);
  const roundStart = (round - 1) * numTeams;
  const chips = order.slice(roundStart, roundStart + numTeams).map((ti, i) => {
    const abs = roundStart + i;
    const t = teams[ti];
    const cls = abs < cur ? 'done' : abs === cur ? 'oc' : '';
    const st = abs === cur ? `border-color:${t?.color || '#f5a623'};color:${t?.color || '#f5a623'};background:${t?.color || '#f5a623'}15;` : '';
    return `<div class="tv-order-chip ${cls}" style="${st}">${h((t?.name || '?'))}</div>`;
  }).join('');
  document.getElementById('tv-order-chips').innerHTML = chips;
  document.getElementById('tv-board-round').textContent = `ROUND ${round}`;
}

// ── Available players (prospect list) ──────────────────────

const posColors = { C:'#f59e0b', SP:'#ef4444', P:'#f97316', '1B':'#10b981', '2B':'#06b6d4', '3B':'#6366f1', SS:'#8b5cf6', OF:'#ec4899', CF:'#ec4899', RF:'#ec4899', LF:'#ec4899', IF:'#60a5fa' };

function renderAvailable(state) {
  const allPlayers = state.players || [];
  const avail = allPlayers.filter(p => p.teamIdx === -1 || p.teamIdx == null || p.teamIdx < 0);
  // Sort alpha (stats stripped)
  avail.sort((a,b) => (a.last||'').localeCompare(b.last||'')||(a.first||'').localeCompare(b.first||''));
  document.getElementById('tv-avail-count').textContent = avail.length;
  // Debug: show raw count in console
  if (typeof console !== 'undefined') console.log('[TV] renderAvailable: allPlayers='+allPlayers.length+' avail='+avail.length);

  if (avail.length === 0) {
    document.getElementById('tv-avail-list').innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,.3);font-size:13px;">'+(allPlayers.length===0?'Waiting for data from draft board…':allPlayers.length+' players — all drafted')+'</div>';
    return;
  }
  document.getElementById('tv-avail-list').innerHTML = avail.map((p, rank) => {
    const init = ((p.first || '')[0] || '') + ((p.last || '')[0] || '');
    const hKey = (p.first + '|' + (p.last || '')[0] + '|' + (p.sport || 'Baseball')).toLowerCase();
    const photo = localHeadshots[hKey];
    const positions = (p.positions || []).slice(0, 3);

    const posTags = positions.map(pos => {
      const c = posColors[pos] || '#94a3b8';
      return `<span class="tvp-pos" style="background:${c}20;color:${c};border:1px solid ${c}40">${h(pos)}</span>`;
    }).join('');

    // Stat chips — youth-optimized: pitching shows WHIP/K/BB, hitting shows OBP/BB%
    const chips = [];
    const isPitcher = p.positions?.includes('SP') || p.positions?.includes('P') || p.pitching;
    if (p.statWHIP)  chips.push(`<span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#10b98112;color:#10b981;border:1px solid #10b98140;">${p.statWHIP} WHIP</span>`);
    if (p.statKBB)   chips.push(`<span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#34d39912;color:#34d399;border:1px solid #34d39940;">${p.statKBB} K/BB</span>`);
    if (p.statOBP)   chips.push(`<span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#60a5fa12;color:#60a5fa;border:1px solid #60a5fa40;">${p.statOBP} OBP</span>`);
    if (p.statBBpct) chips.push(`<span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#818cf812;color:#818cf8;border:1px solid #818cf840;">${p.statBBpct} BB%</span>`);
    if (!chips.length) {
      if (p.statAVG) chips.push(`<span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#60a5fa12;color:#60a5fa;border:1px solid #60a5fa40;">${p.statAVG} AVG</span>`);
      if (p.statSB)  chips.push(`<span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#a78bfa12;color:#a78bfa;border:1px solid #a78bfa40;">${p.statSB} SB</span>`);
    }

    return `<div class="tvp">
      <div class="tvp-av">
        ${photo ? `<img src="${photo}" alt="">` : `<span>${h(init.toUpperCase())}</span>`}
      </div>
      <div class="tvp-info">
        <div class="tvp-name">${h(p.first)} ${h(p.last)}</div>
        ${(posTags || chips.length) ? `<div class="tvp-sub" style="display:flex;flex-wrap:wrap;gap:3px;">${posTags}${chips.join('')}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ── NFL Draft Board columns ──────────────────────────────────
function renderBoard(state) {
  const teams = state.teams || [], players = state.players || [], order = state.draftOrder || [];
  const cur = state.currentPickIdx || 0;
  const isDone = cur >= order.length || state.phase === 'complete';
  const curTi = isDone ? -1 : order[cur];
  const numTeams = Math.max(1, teams.length);

  // Separate pre-assigned (not in pickHistory) from drafted
  const pickedKeys = new Set((state.pickHistory || []).map(ph => ph.playerKey));
  const preByTeam = {};
  players.filter(p => p.teamIdx >= 0 && !pickedKeys.has(p.key)).forEach(p => {
    if (!preByTeam[p.teamIdx]) preByTeam[p.teamIdx] = [];
    preByTeam[p.teamIdx].push(p);
  });
  // How tall the pre-assigned section needs to be (max across all teams)
  const maxPre = teams.length ? Math.max(0, ...teams.map((_, ti) => (preByTeam[ti]||[]).length)) : 0;

  // Draft picks: teamIdx_round → playerKey
  const pickMap = {};
  (state.pickHistory || []).forEach(ph => {
    const r = Math.ceil(ph.pick / Math.max(1, numTeams));
    pickMap[`${ph.teamIdx}_${r}`] = ph.playerKey;
  });
  // How many draft rounds have been played (for sizing)
  const draftRoundsDone = state.pickHistory?.length
    ? Math.max(...(state.pickHistory.map(ph => Math.ceil(ph.pick / Math.max(1, numTeams)))))
    : 0;
  // Show one extra empty "on clock" slot if draft is in progress
  const draftRowsToShow = isDone ? draftRoundsDone : draftRoundsDone + 1;

  const cols = teams.map((t, ti) => {
    const c = t.color || '#60a5fa';
    const isOnClock = ti === curTi;
    const teamPicks = players.filter(p => p.teamIdx === ti);
    const preList = preByTeam[ti] || [];

    const headStyle = isOnClock
      ? `background:${c}dd;`
      : `background:${c}22;`;

    // ── Pre-assigned rows (top), padded to maxPre for alignment ──────────
    const preSlots = Array.from({ length: maxPre }, (_, i) => {
      const p = preList[i];
      if (p) return `<div class="tvb-slot tvb-slot-pre" style="background:${c}12;border-color:${c}28;">
          <div class="tvb-slot-bar" style="background:${c};opacity:.45;"></div>
          <div class="tvb-slot-name">${h(p.first)} ${h(p.last)}</div>
        </div>`;
      return `<div class="tvb-slot tvb-slot-gap"></div>`;
    }).join('');

    // ── Draft pick rows (bottom), only as many as have been used ─────────
    const draftSlots = Array.from({ length: draftRowsToShow }, (_, i) => {
      const round = i + 1;
      const pKey = pickMap[`${ti}_${round}`];
      const pObj = pKey ? players.find(p => p.key === pKey) : null;
      const isCurSlot = !isDone && isOnClock && round === draftRoundsDone + 1;

      if (pObj) {
        return `<div class="tvb-slot tvb-slot-filled" style="background:${c}15;border-color:${c}38;">
          <div class="tvb-slot-bar" style="background:${c};"></div>
          <div class="tvb-slot-name">${h(pObj.first)} ${h(pObj.last)}</div>
          <div class="tvb-slot-meta">R${round}</div>
        </div>`;
      } else if (isCurSlot) {
        return `<div class="tvb-slot tvb-slot-oc" style="border-color:${c}99;background:${c}1a;">
          <div class="tvb-slot-name" style="font-size:10px;letter-spacing:1px;opacity:.7;">NEXT PICK</div>
        </div>`;
      }
      return `<div class="tvb-slot tvb-slot-gap"></div>`;
    }).join('');

    return `<div class="tvb-col${isOnClock ? ' tvb-col-active' : ''}">
      <div class="tvb-col-head" style="${headStyle}">
        <div class="tvb-col-name">${h(t.name || 'Team ' + (ti+1))}</div>
        ${t.coach ? `<div class="tvb-col-coach">${h(t.coach)}</div>` : ''}
      </div>
      <div class="tvb-slots">${preSlots}${draftSlots}</div>
      <div class="tvb-col-count">${teamPicks.length}${t.maxPlayers?'/'+t.maxPlayers:''}</div>
    </div>`;
  }).join('');

  document.getElementById('tv-board-body').innerHTML = cols;
}


// ── Pick banner ──────────────────────────────────────────────
let _bt1 = null, _bt2 = null;
function showBanner(pick, state) {
  if (!pick) return;
  clearTimeout(_bt1); clearTimeout(_bt2);
  const team = state.teams?.[pick.teamIdx];
  const c1 = team?.color || '#2563eb', c2 = team?.color2 || '#d97706';
  const _hex2rgb = hx => { hx = hx.replace('#', ''); return [parseInt(hx.slice(0,2),16),parseInt(hx.slice(2,4),16),parseInt(hx.slice(4,6),16)]; };
  const [r,g,b] = _hex2rgb(c1);
  const deep = `rgb(${Math.max(0,r-55)},${Math.max(0,g-55)},${Math.max(0,b-55)})`;

  document.getElementById('tv-ph1-bar').style.background = c1;
  document.getElementById('tv-ph1-logo-img').src = localHelmetLogo || '';

  document.getElementById('tv-ph2-bg').style.background = `linear-gradient(125deg,${deep} 0%,${c1} 45%,${deep} 100%)`;
  document.getElementById('tv-accent').style.background = `linear-gradient(180deg,${c2} 0%,${c2}66 60%,transparent)`;

  const ph2Logo = document.getElementById('tv-ph2-logo-img');
  ph2Logo.src = team?.logo || localHelmetLogo || '';
  ph2Logo.style.filter = `drop-shadow(0 0 40px rgba(0,0,0,.7)) drop-shadow(0 0 70px ${c2}44)`;

  document.getElementById('tv-ph2-meta').textContent = `RD ${pick.round} · PICK ${pick.pickNum}`;
  document.getElementById('tv-ph2-team').textContent = (team?.name || '').toUpperCase();
  document.getElementById('tv-ph2-team').style.color = c2;
  document.getElementById('tv-ph2-first').textContent = pick.first.toUpperCase();
  document.getElementById('tv-ph2-first').style.color = c2;
  document.getElementById('tv-ph2-first').style.textShadow = `0 4px 32px rgba(0,0,0,.6),0 0 60px ${c2}55`;
  document.getElementById('tv-ph2-last').textContent = pick.last.toUpperCase();
  document.getElementById('tv-ph2-last').style.textShadow = `0 8px 60px rgba(0,0,0,.7),0 0 100px ${c1}55`;

  document.getElementById('tv-ph2-pos').innerHTML = '';

  // Sub chips: name is enough — no stats/returning/city shown
  document.getElementById('tv-ph2-sub').innerHTML = '';

  const ph1 = document.getElementById('tv-ph1');
  const ph2 = document.getElementById('tv-ph2');
  ph1.classList.remove('out'); ph2.classList.remove('in');
  document.getElementById('tv-banner').classList.add('visible');

  _bt1 = setTimeout(() => { ph1.classList.add('out'); ph2.classList.add('in'); }, 2500);
  _bt2 = setTimeout(dismissBanner, 10500);
}

function dismissBanner() {
  clearTimeout(_bt1); clearTimeout(_bt2);
  const b = document.getElementById('tv-banner');
  b.style.transition = 'opacity .4s';
  b.style.opacity = '0';
  setTimeout(() => {
    b.classList.remove('visible');
    b.style.opacity = ''; b.style.transition = '';
    document.getElementById('tv-ph1').classList.remove('out');
    document.getElementById('tv-ph2').classList.remove('in');
  }, 420);
}

function h(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
