<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LYBS Draft Board · Live</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#050d1a; --card:#0a1628; --border:rgba(255,255,255,0.08);
  --gold:#f5a623; --green:#10b981; --blue:#3b82f6; --red:#ef4444;
  --text1:#f0f4ff; --text2:rgba(255,255,255,0.45);
  --hdr:52px; --tabs:38px;
}
html,body { background:var(--bg); color:var(--text1); font-family:'Inter',sans-serif;
  height:100dvh; overflow:hidden; }

/* HEADER */
#hdr {
  position:fixed; top:0; left:0; right:0; z-index:50; height:var(--hdr);
  background:rgba(5,13,26,0.97); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 14px; gap:10px;
}
#hdr-title { font-family:'Bebas Neue'; font-size:20px; flex:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#hdr-badge {
  font-size:9px; font-weight:700; letter-spacing:1.5px; padding:3px 8px;
  border-radius:5px; white-space:nowrap; flex-shrink:0;
  border:1px solid rgba(245,166,35,.4); background:rgba(245,166,35,.1); color:var(--gold);
}
#hdr-dot { width:7px; height:7px; border-radius:50%; background:var(--text2);
  flex-shrink:0; transition:background .4s; }
#hdr-dot.live { background:var(--green); box-shadow:0 0 7px var(--green); }

/* TAB BAR */
#tab-bar {
  position:fixed; top:var(--hdr); left:0; right:0; z-index:40; height:var(--tabs);
  display:flex; background:rgba(5,13,26,.97); border-bottom:1px solid var(--border);
}
.tab { flex:1; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:600; letter-spacing:.5px; text-transform:uppercase;
  color:var(--text2); cursor:pointer; border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s; }
.tab.active { color:var(--gold); border-color:var(--gold); }

/* SCROLL */
#scroll { position:fixed; top:calc(var(--hdr) + var(--tabs)); left:0; right:0; bottom:0; overflow:hidden; }

/* BOARD */
#board-view { position:absolute; inset:0; overflow-x:auto; overflow-y:auto;
  -webkit-overflow-scrolling:touch; padding:10px 8px 20px; }
#board-grid { display:flex; gap:6px; min-height:100%; }
.team-col { flex-shrink:0; width:120px; display:flex; flex-direction:column; gap:4px; }
.team-col-head { border-radius:8px 8px 0 0; padding:9px 8px 7px; text-align:center; }
.team-col-name { font-family:'Bebas Neue'; font-size:15px; letter-spacing:.5px;
  line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.team-col-count { font-size:9px; font-weight:700; margin-top:3px; opacity:.7; }
.team-col-oc { font-size:8px; font-weight:700; letter-spacing:2px; color:#fff; margin-top:2px; }
.pick-cell { border-radius:7px; padding:7px 8px 6px; min-height:54px;
  border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04);
  position:relative; display:flex; flex-direction:column; justify-content:center; }
.pick-cell-bar { position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:7px 0 0 7px; }
.pick-cell-name { font-weight:700; font-size:11px; line-height:1.2; padding-left:7px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pick-cell-meta { display:flex; gap:4px; align-items:center; padding-left:7px; margin-top:2px; flex-wrap:wrap; }
.pick-cell-rd  { font-size:8px; color:rgba(255,255,255,.2); }
.pick-cell-pos { font-size:8px; font-weight:700; }
.pick-cell-stat { font-size:8px; color:rgba(255,255,255,.32); }
.pick-cell-oc { border-style:dashed; animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.pick-cell-oc-label { font-size:9px; font-weight:700; letter-spacing:1px; text-align:center; width:100%; }

/* AVAILABLE */
#avail-view { position:absolute; inset:0; overflow-y:auto;
  -webkit-overflow-scrolling:touch; display:none; padding:8px 10px 20px; }
.avail-row { display:flex; align-items:flex-start; gap:10px; padding:9px 11px;
  border-radius:9px; background:var(--card); border:1px solid var(--border); margin-bottom:3px; }
.avail-rank { font-size:10px; color:var(--text2); min-width:22px; text-align:right; padding-top:2px; }
.avail-info { flex:1; min-width:0; }
.avail-name { font-weight:700; font-size:13px; }
.avail-sub  { font-size:10px; color:var(--text2); margin-top:1px; }
.avail-chips { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
.chip { font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px; border:1px solid; white-space:nowrap; }
.pos-tag { font-size:9px; font-weight:700; padding:1px 5px; border-radius:3px; }

/* ON CLOCK */
#clock-view { position:absolute; inset:0; overflow-y:auto;
  -webkit-overflow-scrolling:touch; display:none;
  flex-direction:column; gap:12px; padding:16px 14px; }
#clock-view.visible { display:flex; }
#clock-team-card { width:100%; border-radius:14px; padding:20px; border:1px solid; text-align:center; }
#clock-team-name { font-family:'Bebas Neue'; font-size:38px; line-height:1; }
#clock-round { font-size:12px; letter-spacing:1.5px; text-transform:uppercase; margin-top:6px; opacity:.7; }
#clock-timer { font-family:'Bebas Neue'; font-size:52px; margin-top:8px; }
#clock-roster { width:100%; border-radius:12px; background:rgba(255,255,255,.04);
  border:1px solid var(--border); padding:14px; }
#clock-roster-title { font-family:'Bebas Neue'; font-size:13px; color:var(--text2);
  letter-spacing:1px; margin-bottom:8px; }
.roster-row { display:flex; align-items:center; gap:8px; padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.04); font-size:13px; }
.roster-row:last-child { border-bottom:none; }
.roster-num  { color:var(--text2); font-size:10px; min-width:20px; }
.roster-name { flex:1; font-weight:600; }
.roster-pos  { font-size:10px; color:var(--text2); }
.roster-stat { font-size:9px; color:rgba(96,165,250,.7); }
.roster-empty { padding:5px 0; font-size:11px; color:rgba(255,255,255,.2);
  text-align:center; border:1px dashed rgba(255,255,255,.1); border-radius:6px; margin-bottom:2px; }

/* CONNECTING */
#connecting { position:fixed; inset:0; z-index:200; background:var(--bg);
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:14px; padding:32px; text-align:center; }
#connecting h2 { font-family:'Bebas Neue'; font-size:28px; color:var(--gold); }
#connecting p  { color:var(--text2); font-size:13px; line-height:1.6; max-width:300px; }
.dots { display:flex; gap:8px; }
.dots span { width:8px; height:8px; border-radius:50%; background:var(--gold);
  animation:dp 1.2s ease-in-out infinite; }
.dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{transform:scale(.4);opacity:.3}40%{transform:scale(1);opacity:1}}

/* BANNER - 2-phase desktop-style */
#banner {
  position:fixed; inset:0; z-index:300;
  pointer-events:none; overflow:hidden;
  opacity:0; transition:opacity .3s;
}
#banner.visible { opacity:1; pointer-events:all; }

#ban-ph1 {
  position:absolute; inset:0; background:#fff;
  display:flex; align-items:center;
  padding:28px 32px; overflow:hidden;
  transition:opacity .4s ease;
}
#ban-ph1.out { opacity:0; }
#ban-ph1-text {
  font-family:'Bebas Neue'; font-size:clamp(56px,18vw,120px);
  line-height:.82; letter-spacing:-2px; color:#111;
  animation:ph1Wipe .5s cubic-bezier(.16,1,.3,1) both;
}
@keyframes ph1Wipe { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0% 0 0)} }
#ban-ph1-logo {
  position:absolute; top:20px; right:24px;
  width:clamp(52px,14vw,90px);
}
#ban-ph1-logo img { width:100%; height:auto; }
#ban-ph1-bar { position:absolute; bottom:0; left:0; right:0; height:10px; }

#ban-ph2 {
  position:absolute; inset:0; overflow:hidden;
  opacity:0; transition:opacity .5s ease;
}
#ban-ph2.in { opacity:1; }
#ban-ph2-bg {
  position:absolute; inset:0;
  animation:bgWipe .55s cubic-bezier(.77,0,.18,1) both;
}
@keyframes bgWipe { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0% 0 0)} }
#ban-grain {
  position:absolute; inset:0; pointer-events:none; opacity:.055;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:180px 180px;
}
#ban-vignette {
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 55% 50%, rgba(0,0,0,0) 25%, rgba(0,0,0,.6) 100%);
}
#ban-flare {
  position:absolute; top:-20%; bottom:-20%; width:50%;
  background:linear-gradient(to right, transparent, rgba(255,255,255,.14), transparent);
  transform:skewX(-18deg);
  animation:flare .9s ease .7s both;
}
@keyframes flare { from{left:-80%} to{left:170%} }
#ban-accent { position:absolute; left:0; top:0; bottom:0; width:7px; z-index:3; }
#ban-ph2-layout {
  position:relative; z-index:2; height:100%;
  display:flex; align-items:center;
  gap:clamp(14px,4vw,40px);
  padding:20px 24px;
}
#ban-ph2-logo-col { flex-shrink:0; display:flex; align-items:center; justify-content:center; }
#ban-ph2-logo-col img {
  width:clamp(90px,24vw,160px); height:auto;
  animation:logoDrop .65s cubic-bezier(.34,1.56,.64,1) .1s both;
  filter:drop-shadow(0 0 30px rgba(0,0,0,.7));
}
@keyframes logoDrop {
  0%   { transform:translateY(-80px) scale(.8); opacity:0; }
  70%  { transform:translateY(7px) scale(1.05); }
  100% { transform:translateY(0) scale(1); opacity:1; }
}
#ban-ph2-names { flex:1; display:flex; flex-direction:column; justify-content:center; min-width:0; overflow:hidden; }
#ban-ph2-meta {
  font-size:clamp(10px,2.5vw,13px); letter-spacing:3px;
  color:rgba(255,255,255,.5); margin-bottom:4px;
  animation:slamL .45s cubic-bezier(.22,1,.36,1) .22s both;
}
#ban-ph2-team {
  font-size:clamp(12px,3.5vw,18px); letter-spacing:2.5px; font-weight:800;
  margin-bottom:5px;
  animation:slamL .45s cubic-bezier(.22,1,.36,1) .28s both;
}
#ban-ph2-first {
  font-family:'Bebas Neue'; font-size:clamp(38px,13vw,80px);
  line-height:1; letter-spacing:2px; font-style:italic;
  text-shadow:0 4px 24px rgba(0,0,0,.6);
  animation:slamL .5s cubic-bezier(.22,1,.36,1) .32s both;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#ban-ph2-last {
  font-family:'Bebas Neue'; font-size:clamp(52px,20vw,130px);
  line-height:.82; color:#fff; letter-spacing:1px;
  text-shadow:0 8px 40px rgba(0,0,0,.6);
  animation:slamR .55s cubic-bezier(.22,1,.36,1) .24s both;
  margin-bottom:clamp(8px,2vw,16px);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#ban-ph2-pos {
  display:flex; gap:8px; flex-wrap:wrap;
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1) .54s both;
}
.ban-pos-badge {
  font-family:'Bebas Neue'; display:inline-block;
  font-size:clamp(14px,5vw,36px); font-weight:900; letter-spacing:2px;
  padding:4px 16px; transform:skewX(-4deg);
  box-shadow:4px 4px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
  color:#000;
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1) .54s both;
}
#ban-ph2-sub {
  display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  margin-top:10px;
  animation:slamL .4s ease .7s both;
}
.ban-sub-chip {
  font-family:'DM Sans',sans-serif; font-size:clamp(10px,2.5vw,13px);
  font-weight:700; padding:3px 10px; border-radius:20px;
  background:rgba(255,255,255,.1); color:rgba(255,255,255,.7);
  letter-spacing:1px;
}
.ban-dismiss {
  position:absolute; bottom:14px; right:16px; z-index:5;
  font-size:11px; color:rgba(255,255,255,.2); letter-spacing:2px;
  animation:pulseFade 2s ease-in-out .9s infinite;
  font-family:'DM Sans',sans-serif;
}
@keyframes slamL { 0%{transform:translateX(-60px);opacity:0} 65%{transform:translateX(4px)} 100%{transform:translateX(0);opacity:1} }
@keyframes slamR { 0%{transform:translateX(60px) scaleX(1.08);opacity:0} 60%{transform:translateX(-4px) scaleX(.99)} 100%{transform:translateX(0) scaleX(1);opacity:1} }
@keyframes popIn  { 0%{transform:scale(0) skewX(-4deg);opacity:0} 65%{transform:scale(1.14) skewX(-4deg)} 100%{transform:scale(1) skewX(-4deg);opacity:1} }
@keyframes pulseFade{0%,100%{opacity:.2}50%{opacity:.65}}
</style>
</head>
<body>

<div id="connecting">
  <h2>📋 DRAFT BOARD</h2>
  <div class="dots"><span></span><span></span><span></span></div>
  <p>Waiting for draft state…<br>Keep this tab open alongside the main dashboard.</p>
</div>

<div id="banner" onclick="dismissBanner()">
  <div id="ban-ph1">
    <div id="ban-ph1-text">THE PICK<br>IS IN</div>
    <div id="ban-ph1-logo"><img id="ban-ph1-logo-img" src="" alt="LYBS"></div>
    <div id="ban-ph1-bar"></div>
  </div>
  <div id="ban-ph2">
    <div id="ban-ph2-bg"></div>
    <div id="ban-grain"></div>
    <div id="ban-vignette"></div>
    <div id="ban-flare"></div>
    <div id="ban-accent"></div>
    <div id="ban-ph2-layout">
      <div id="ban-ph2-logo-col"><img id="ban-ph2-logo-img" src="" alt=""></div>
      <div id="ban-ph2-names">
        <div id="ban-ph2-meta"></div>
        <div id="ban-ph2-team"></div>
        <div id="ban-ph2-first"></div>
        <div id="ban-ph2-last"></div>
        <div id="ban-ph2-pos"></div>
        <div id="ban-ph2-sub"></div>
      </div>
    </div>
    <div class="ban-dismiss">TAP TO DISMISS</div>
  </div>
</div>

<div id="hdr">
  <div id="hdr-title">DRAFT BOARD</div>
  <div id="hdr-badge">—</div>
  <div id="hdr-dot"></div>
</div>

<div id="tab-bar">
  <div class="tab active" id="tab-board" onclick="switchTab('board')">🏟 Board</div>
  <div class="tab" id="tab-avail"  onclick="switchTab('avail')">📋 Available</div>
  <div class="tab" id="tab-clock"  onclick="switchTab('clock')">⏱ On Clock</div>
</div>

<div id="scroll">
  <div id="board-view"><div id="board-grid"></div></div>
  <div id="avail-view">
    <div id="avail-count" style="font-size:11px;color:var(--text2);padding:2px 2px 6px;"></div>
    <div id="avail-list"></div>
  </div>
  <div id="clock-view">
    <div id="clock-team-card">
      <div id="clock-team-name">—</div>
      <div id="clock-round">Waiting for draft</div>
      <div id="clock-timer">—</div>
    </div>
    <div id="clock-roster">
      <div id="clock-roster-title">CURRENT ROSTER</div>
      <div id="clock-roster-list"></div>
    </div>
  </div>
</div>

<script>
'use strict';
let _state = null, _tab = 'board';
let _clockStart = null, _clockInterval = null, _clockTeamIdx = -1, _bannerTimer = null, _bannerTimer2 = null;
let localHelmetLogo = null;

// ── BroadcastChannel (primary — same browser on same device) ─
const bc = new BroadcastChannel('lybs_draft_tv');
bc.onmessage = e => {
  const d = e.data;
  if (d.helmetLogo) localHelmetLogo = d.helmetLogo;
  if (d.type === 'draft_state') applyState(d.state);
  if (d.type === 'draft_pick')  { showBanner(d.pick, d.state); setTimeout(() => applyState(d.state), 6000); }
  if (d.type === 'ping')        bc.postMessage({ type: 'pong' });
};
setTimeout(() => bc.postMessage({ type: 'request_state' }), 600);

// ── SSE Relay (optional — when ?relay=IP:PORT is given) ──────
const _params = new URLSearchParams(location.search);
const _relay  = _params.get('relay');
if (_relay) {
  const _port = _params.get('port') || '3001';
  (function connectSSE() {
    const src = new EventSource(`http://${_relay}:${_port}/events`);
    src.addEventListener('state', e => applyState(JSON.parse(e.data)));
    src.addEventListener('pick',  e => {
      const d = JSON.parse(e.data);
      showBanner(d.pick, d.state);
      setTimeout(() => applyState(d.state), 6000);
    });
    src.onerror = () => { src.close(); setTimeout(connectSSE, 3000); };
  })();
}

// ── Tabs ─────────────────────────────────────────────────────
function switchTab(tab) {
  _tab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('board-view').style.display = tab === 'board' ? 'block' : 'none';
  document.getElementById('avail-view').style.display = tab === 'avail' ? 'block' : 'none';
  document.getElementById('clock-view').style.display = tab === 'clock' ? 'flex'  : 'none';
}

// ── Apply State ───────────────────────────────────────────────
function applyState(state) {
  if (!state) return;
  _state = state;
  document.getElementById('connecting').style.display = 'none';
  document.getElementById('hdr-dot').classList.add('live');

  const teams = state.teams || [], order = state.draftOrder || [], cur = state.currentPickIdx || 0;
  const isDone = cur >= order.length || state.phase === 'complete';
  const curTi  = isDone ? -1 : (order[cur]?.teamIdx ?? order[cur]);
  const curT   = curTi >= 0 ? teams[curTi] : null;
  const nTeams = Math.max(1, teams.length);
  const round  = Math.ceil((cur + 1) / nTeams);
  const pickN  = (cur % nTeams) + 1;

  if (curT) {
    const c = curT.color || 'var(--gold)';
    document.getElementById('hdr-title').textContent = (curT.name||'Team').toUpperCase() + ' ON CLOCK';
    document.getElementById('hdr-title').style.color = c;
    document.getElementById('hdr-badge').textContent = `R${round} · P${pickN}`;
    document.getElementById('hdr-badge').style.color = c;
    document.getElementById('hdr-badge').style.borderColor = c + '55';
    document.getElementById('hdr-badge').style.background  = c + '18';
    startClock(curTi);
  } else {
    document.getElementById('hdr-title').textContent = isDone ? '✓ DRAFT COMPLETE' : 'DRAFT BOARD';
    document.getElementById('hdr-title').style.color = '';
    document.getElementById('hdr-badge').textContent = isDone ? 'DONE' : '—';
    stopClock();
  }

  renderBoard(state, curTi, round, cur, teams, order);
  renderAvail(state);
  renderClock(state, curT, curTi, round, pickN);
}

// ── Clock ─────────────────────────────────────────────────────
function startClock(ti) {
  if (_clockTeamIdx === ti && _clockStart) return;
  _clockTeamIdx = ti; _clockStart = Date.now();
  clearInterval(_clockInterval);
  _clockInterval = setInterval(updateClock, 500);
  updateClock();
}
function stopClock() {
  clearInterval(_clockInterval); _clockStart = null; _clockTeamIdx = -1;
  const el = document.getElementById('clock-timer');
  el.textContent = '—'; el.style.color = '';
}
function updateClock() {
  if (!_clockStart) return;
  const s = Math.floor((Date.now() - _clockStart) / 1000);
  const el = document.getElementById('clock-timer');
  el.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  el.style.color  = s < 60 ? '#10b981' : s < 120 ? '#f5a623' : '#ef4444';
}

// ── Position colors ───────────────────────────────────────────
const PC = {C:'#f59e0b',SP:'#ef4444',P:'#f97316','1B':'#10b981','2B':'#06b6d4',
            '3B':'#6366f1',SS:'#8b5cf6',OF:'#ec4899',CF:'#ec4899',IF:'#60a5fa','C/1B':'#f59e0b'};
const pc = p => PC[p] || '#94a3b8';

// ── Stat chips ────────────────────────────────────────────────
function statChips(p, small) {
  const sz = small ? '8px' : '9px';
  const chips = [];
  if (p.statERA) chips.push(`<span class="chip" style="font-size:${sz};color:#10b981;border-color:#10b98140;background:#10b98112;">${p.statERA} ERA</span>`);
  if (p.statFIP) chips.push(`<span class="chip" style="font-size:${sz};color:#34d399;border-color:#34d39940;background:#34d39912;">${p.statFIP} FIP</span>`);
  if (p.statAVG) chips.push(`<span class="chip" style="font-size:${sz};color:#60a5fa;border-color:#60a5fa40;background:#60a5fa12;">${p.statAVG} AVG</span>`);
  if (p.statH10) chips.push(`<span class="chip" style="font-size:${sz};color:#818cf8;border-color:#818cf840;background:#818cf812;">${p.statH10} H/10</span>`);
  if (p.statRBI) chips.push(`<span class="chip" style="font-size:${sz};color:#f59e0b;border-color:#f59e0b40;background:#f59e0b12;">${p.statRBI} RBI</span>`);
  if (p.statSB)  chips.push(`<span class="chip" style="font-size:${sz};color:#a78bfa;border-color:#a78bfa40;background:#a78bfa12;">${p.statSB} SB</span>`);
  return chips.join('');
}

// ── Board ─────────────────────────────────────────────────────
function renderBoard(state, curTi, curRound, cur, teams, order) {
  const players = state.players || [];
  const nTeams  = Math.max(1, teams.length);
  const rounds  = Math.min(Math.ceil(order.length / nTeams), curRound + 1);
  const pm = {};
  (state.pickHistory||[]).forEach(ph => { const r = Math.ceil(ph.pick/nTeams); pm[`${ph.teamIdx}_${r}`] = ph.playerKey; });

  document.getElementById('board-grid').innerHTML = teams.map((t, ti) => {
    const c   = t.color || '#60a5fa';
    const isOC = ti === curTi;
    const cnt  = players.filter(p => p.teamIdx === ti).length;
    const slots = Array.from({length:rounds}, (_,i) => {
      const r = i + 1, pObj = players.find(p => p.key === pm[`${ti}_${r}`]);
      if (pObj) {
        const pos = (pObj.positions||[])[0]||'';
        const stat = pObj.statERA ? pObj.statERA+' ERA' : pObj.statAVG ? pObj.statAVG+' AVG' : pObj.statH10 ? pObj.statH10+' H/10' : '';
        return `<div class="pick-cell" style="background:${c}10;border-color:${c}28;">
          <div class="pick-cell-bar" style="background:${c};"></div>
          <div class="pick-cell-name">${h(pObj.first)} ${h(pObj.last)}</div>
          <div class="pick-cell-meta">
            <span class="pick-cell-rd">R${r}</span>
            ${pos ? `<span class="pick-cell-pos" style="color:${pc(pos)}">${h(pos)}</span>` : ''}
            ${stat ? `<span class="pick-cell-stat">${stat}</span>` : ''}
          </div>
        </div>`;
      } else if (isOC && r === curRound) {
        return `<div class="pick-cell pick-cell-oc" style="border-color:${c}66;background:${c}08;">
          <div class="pick-cell-oc-label" style="color:${c};">▶ ON CLOCK</div>
          <div class="pick-cell-meta"><span class="pick-cell-rd">Round ${r}</span></div>
        </div>`;
      }
      return `<div class="pick-cell" style="opacity:.2;"><div class="pick-cell-meta"><span class="pick-cell-rd">R${r}</span></div></div>`;
    }).join('');

    return `<div class="team-col">
      <div class="team-col-head" style="background:${isOC?c+'cc':c+'18'};color:${isOC?'#fff':c};">
        <div class="team-col-name">${h(t.name||'Team')}</div>
        <div class="team-col-count">${cnt}/${t.maxPlayers||'—'}</div>
        ${isOC ? `<div class="team-col-oc">▶ ON CLOCK</div>` : ''}
      </div>${slots}</div>`;
  }).join('');
}

// ── Available ─────────────────────────────────────────────────
function renderAvail(state) {
  const players = state.players || [];
  const avail   = players.filter(p => p.teamIdx < 0 || p.teamIdx == null);
  avail.sort((a,b) => (a.last||'').localeCompare(b.last||'') || (a.first||'').localeCompare(b.first||''));
  document.getElementById('avail-count').textContent = `${avail.length} available`;
  document.getElementById('avail-list').innerHTML = avail.map((p, i) => {
    const positions = (p.positions||[]).slice(0,3);
    const posTags   = positions.map(pos => {
      const c = pc(pos);
      return `<span class="pos-tag" style="background:${c}20;color:${c};border:1px solid ${c}40">${h(pos)}</span>`;
    }).join('');
    const chips    = statChips(p);
    const statSrc  = p.statYear ? ` · ${p.statTeam||''} ${p.statYear}` : '';
    return `<div class="avail-row">
      <div class="avail-rank">${i+1}</div>
      <div class="avail-info">
        <div style="display:flex;align-items:center;gap:6px;">
          <div class="avail-name">${h(p.first)} ${h(p.last)}</div>
          ${p.pitching?'<span style="font-size:11px;">⚾</span>':''}
          ${p.catching?'<span style="font-size:11px;">🥎</span>':''}
          ${p.isReturning?'<span style="font-size:9px;padding:1px 4px;border-radius:3px;background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3);">RET</span>':''}
        </div>
        <div class="avail-sub">${[p.city,p.sport].filter(Boolean).join(' · ')}${statSrc}</div>
        ${(posTags||chips)?`<div class="avail-chips">${posTags}${chips}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ── On-Clock ──────────────────────────────────────────────────
function renderClock(state, curT, curTi, round, pickN) {
  const players = state.players || [];
  const c = curT?.color || 'var(--gold)';
  const card = document.getElementById('clock-team-card');
  card.style.borderColor = c + '66'; card.style.background = c + '12';
  document.getElementById('clock-team-name').textContent = curT ? curT.name : '—';
  document.getElementById('clock-team-name').style.color = c;
  document.getElementById('clock-round').textContent = curT ? `Round ${round} · Pick ${pickN}` : 'Waiting for draft';
  if (!curT) { stopClock(); return; }

  const roster = players.filter(p => p.teamIdx === curTi);
  const max    = curT?.maxPlayers || 10;
  let rHtml = roster.map((p,i) => {
    const pos  = (p.positions||[])[0]||'';
    const stat = p.statERA ? p.statERA+' ERA' : p.statAVG ? p.statAVG+' AVG' : p.statH10 ? p.statH10+' H/10' : '';
    return `<div class="roster-row">
      <span class="roster-num">${i+1}</span>
      <span class="roster-name">${h(p.first)} ${h(p.last)}</span>
      ${pos?`<span class="roster-pos">${h(pos)}</span>`:''}
      ${stat?`<span class="roster-stat">${stat}</span>`:''}
    </div>`;
  }).join('');
  for (let i=roster.length; i<max; i++) rHtml += `<div class="roster-empty">— slot ${i+1} —</div>`;
  document.getElementById('clock-roster-list').innerHTML = rHtml;
}

// ── Pick Banner ───────────────────────────────────────────────
function showBanner(pick, state) {
  if (!pick || !state) return;
  clearTimeout(_bannerTimer); clearTimeout(_bannerTimer2);
  const teams = state.teams||[], t = teams[pick.teamIdx]||{};
  const c1 = t.color||'#2563eb', c2 = t.color2||'#d97706';
  const _hex2rgb = hx => { hx = hx.replace('#',''); return [parseInt(hx.slice(0,2),16),parseInt(hx.slice(2,4),16),parseInt(hx.slice(4,6),16)]; };
  const [r,g,b] = _hex2rgb(c1);
  const deep = `rgb(${Math.max(0,r-55)},${Math.max(0,g-55)},${Math.max(0,b-55)})`;

  document.getElementById('ban-ph1-bar').style.background = c1;
  document.getElementById('ban-ph1-logo-img').src = localHelmetLogo || '';

  document.getElementById('ban-ph2-bg').style.background = `linear-gradient(125deg,${deep} 0%,${c1} 45%,${deep} 100%)`;
  document.getElementById('ban-accent').style.background = `linear-gradient(180deg,${c2} 0%,${c2}66 60%,transparent)`;

  const ph2Logo = document.getElementById('ban-ph2-logo-img');
  ph2Logo.src = t.logo || localHelmetLogo || '';
  ph2Logo.style.filter = `drop-shadow(0 0 30px rgba(0,0,0,.7)) drop-shadow(0 0 50px ${c2}44)`;

  document.getElementById('ban-ph2-meta').textContent = `RD ${pick.round||''} · PICK ${pick.pickNum||pick.pick||''}`;
  const teamEl = document.getElementById('ban-ph2-team');
  teamEl.textContent = (t.name||'').toUpperCase(); teamEl.style.color = c2;
  const firstEl = document.getElementById('ban-ph2-first');
  firstEl.textContent = (pick.first||'').toUpperCase(); firstEl.style.color = c2;
  firstEl.style.textShadow = `0 4px 24px rgba(0,0,0,.6),0 0 40px ${c2}55`;
  document.getElementById('ban-ph2-last').textContent = (pick.last||'').toUpperCase();

  document.getElementById('ban-ph2-pos').innerHTML = (pick.positions||[]).map(p =>
    `<span class="ban-pos-badge" style="background:${c2};">${h(p)}</span>`
  ).join('');

  const chips = [];
  if (pick.isReturning !== undefined) chips.push(pick.isReturning ? 'RETURNING' : 'NEW PLAYER');
  if (pick.city) chips.push('📍 ' + pick.city);
  document.getElementById('ban-ph2-sub').innerHTML = chips.map(c =>
    `<span class="ban-sub-chip">${h(c)}</span>`).join('');

  const ph1 = document.getElementById('ban-ph1');
  const ph2 = document.getElementById('ban-ph2');
  ph1.classList.remove('out'); ph2.classList.remove('in');
  document.getElementById('banner').classList.add('visible');

  _bannerTimer  = setTimeout(() => { ph1.classList.add('out'); ph2.classList.add('in'); }, 2500);
  _bannerTimer2 = setTimeout(dismissBanner, 14000);
}
function dismissBanner() {
  clearTimeout(_bannerTimer); clearTimeout(_bannerTimer2);
  const b = document.getElementById('banner');
  b.style.transition = 'opacity .4s'; b.style.opacity = '0';
  setTimeout(() => {
    b.classList.remove('visible');
    b.style.opacity = ''; b.style.transition = '';
    document.getElementById('ban-ph1').classList.remove('out');
    document.getElementById('ban-ph2').classList.remove('in');
    if (_state) applyState(_state);
  }, 420);
}

function h(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
